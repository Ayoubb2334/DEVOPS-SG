stages:
  - build
  - test
  - docker
  - security
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
include:
  - template: Security/SAST.gitlab-ci.yml

# ---------------------------------------------------------
# BUILD - Backend (.NET)
# ---------------------------------------------------------
build-backend:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - cd backend
    - dotnet restore
    - dotnet build --configuration Release
  rules:
    - changes:
        - backend/**/*

# ---------------------------------------------------------
# BUILD - Frontend (Angular)
# ---------------------------------------------------------
build-frontend:
  stage: build
  image: node:20
  script:
    - cd frontend
    - npm install
    - npm run build -- --configuration production
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour
  rules:
    - changes:
        - frontend/**/*

# ---------------------------------------------------------
# TEST - Backend (.NET)
# ---------------------------------------------------------
test-backend:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - cd backend
    - dotnet test --configuration Release --logger "console;verbosity=normal"
  rules:
    - changes:
        - backend/**/*
  allow_failure: true

# ---------------------------------------------------------
# TEST - Frontend (Angular)
# ---------------------------------------------------------
test-frontend:
  stage: test
  image: node:20
  script:
    - cd frontend
    - npm install
    - npm run test -- --watch=false --browsers=ChromeHeadless
  rules:
    - changes:
        - frontend/**/*
  allow_failure: true

# ---------------------------------------------------------
# DOCKER - Build & push backend image
# ---------------------------------------------------------
docker-backend:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA -t $BACKEND_IMAGE:latest ./backend
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $BACKEND_IMAGE:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------------------
# DOCKER - Build & push frontend image
# ---------------------------------------------------------
docker-frontend:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA -t $FRONTEND_IMAGE:latest ./frontend
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $FRONTEND_IMAGE:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------------------
# DEPLOY - Helm chart to Kubernetes (manual trigger)
# ---------------------------------------------------------
deploy:
  stage: deploy
  image: alpine/helm:3.14.0
  script:
    - helm upgrade --install mon-app ./smartphone-app-chart
        --set backend.image.tag=$CI_COMMIT_SHORT_SHA
        --set frontend.image.tag=$CI_COMMIT_SHORT_SHA
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual 
# ---------------------------------------------------------
# SECURITY - Trivy scan (backend image)
# ---------------------------------------------------------
trivy-backend:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL --format table $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs: ["docker-backend"]
# ---------------------------------------------------------
# SECURITY - Trivy scan (frontend image)
# ---------------------------------------------------------
trivy-frontend:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL --format table $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs: ["docker-frontend"]