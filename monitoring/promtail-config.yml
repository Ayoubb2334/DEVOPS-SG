server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Collecte automatique des logs de TOUS les conteneurs Docker via le socket Docker
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      # Nom du conteneur comme label "container"
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Nom du service docker-compose comme label "service"
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

      # Projet docker-compose (utile si plusieurs projets sur la même machine)
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'

      # Log stream (stdout/stderr)
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'

    pipeline_stages:
      # Parse les logs JSON structurés si votre backend .NET log en JSON (Serilog)
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
          source: log
      # N'applique le parsing JSON que s'il réussit ; sinon garde le log brut (utile pour Angular/nginx en texte simple)
      - labels:
          level:
