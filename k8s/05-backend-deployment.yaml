apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: smartphone-app
spec:
  replicas: 2   # 2 instances du backend en parallèle — impossible avec docker-compose seul !
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Attend que Postgres réponde avant de démarrer le conteneur principal
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z postgres 5432; do echo en attente de postgres...; sleep 2; done"
      containers:
        - name: backend
          image: smartphone-app-backend:latest
          imagePullPolicy: IfNotPresent   # utilise l'image déjà construite localement, sans registre
          ports:
            - containerPort: 8080
          env:
            - name: PG_HOST
              value: postgres   # nom du Service Postgres = résolution DNS automatique
            - name: PG_PORT
              value: "5432"
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: PG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
