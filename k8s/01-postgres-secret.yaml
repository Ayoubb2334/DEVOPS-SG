# Équivalent du fichier .env pour la base de données.
# stringData permet d'écrire les valeurs en clair ici (Kubernetes les encode en base64 automatiquement).
# ⚠️ Ne jamais committer ce fichier avec de vrais mots de passe sur un dépôt public.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: smartphone-app
type: Opaque
stringData:
  POSTGRES_DB: smartphonedb
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
