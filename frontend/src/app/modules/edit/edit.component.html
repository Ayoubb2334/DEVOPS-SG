<p-toast></p-toast>

<div class="page-header">
  <div>
    <span class="eyebrow">Édition</span>
    <h2>Modifier le smartphone</h2>
  </div>
</div>

<div class="form-card" *ngIf="!loading; else skeleton">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
    <div class="field span-2">
      <label class="form-label">Marque *</label>
      <input pInputText formControlName="marque" />
    </div>

    <div class="field span-2">
      <label class="form-label">Modèle *</label>
      <input pInputText formControlName="modele" />
    </div>

    <div class="field">
      <label class="form-label">Prix (€) *</label>
      <p-inputNumber formControlName="prix" mode="decimal" [minFractionDigits]="2" [maxFractionDigits]="2"></p-inputNumber>
    </div>

    <div class="field">
      <label class="form-label">Stock *</label>
      <p-inputNumber formControlName="stock"></p-inputNumber>
    </div>

    <div class="field span-2">
      <label class="form-label">Description</label>
      <textarea pInputTextarea formControlName="description" rows="4"></textarea>
    </div>

    <div class="field span-2 actions">
      <button pButton type="submit" label="Mettre à jour" icon="pi pi-check" [disabled]="submitting"></button>
      <button pButton type="button" label="Annuler" class="p-button-secondary" (click)="onCancel()"></button>
    </div>
  </form>
</div>

<ng-template #skeleton>
  <div class="form-card skeleton-card">
    <div class="skeleton-line w-40"></div>
    <div class="skeleton-line w-100"></div>
    <div class="skeleton-line w-40"></div>
    <div class="skeleton-line w-100"></div>
    <div class="skeleton-line w-40"></div>
    <div class="skeleton-line w-60"></div>
  </div>
</ng-template>
