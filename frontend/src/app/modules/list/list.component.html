<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="page-header">
  <div>
    <span class="eyebrow">Catalogue</span>
    <h2>Liste des smartphones</h2>
  </div>
  <button pButton type="button" label="Ajouter un smartphone" icon="pi pi-plus" (click)="onAdd()"></button>
</div>

<div class="table-card">
  <p-table [value]="smartphones" [loading]="loading" [paginator]="true" [rows]="10" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Marque</th>
        <th>Modèle</th>
        <th>Prix</th>
        <th>Stock</th>
        <th style="width: 110px">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-smartphone>
      <tr>
        <td class="cell-brand">{{ smartphone.marque }}</td>
        <td>{{ smartphone.modele }}</td>
        <td class="cell-price">{{ smartphone.prix | number:'1.2-2' }} €</td>
        <td>
          <span class="stock-pill" [class.low]="smartphone.stock < 5">
            <span class="dot"></span>{{ smartphone.stock }}
          </span>
        </td>
        <td>
          <button pButton icon="pi pi-pencil" class="p-button-sm p-button-text me-1" (click)="onEdit(smartphone.id)" pTooltip="Modifier"></button>
          <button pButton icon="pi pi-trash" class="p-button-sm p-button-text p-button-danger" (click)="onDelete(smartphone)" pTooltip="Supprimer"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5">
          <div class="empty-state">
            <i class="pi pi-mobile"></i>
            <p>Aucun smartphone enregistré</p>
            <span>Ajoutez votre premier produit pour commencer.</span>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
