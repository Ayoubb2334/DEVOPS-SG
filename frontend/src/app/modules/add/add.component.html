<p-toast></p-toast>

<div class="page-header">
  <div>
    <span class="eyebrow">Nouveau produit</span>
    <h2>Ajouter un smartphone</h2>
  </div>
</div>

<div class="form-card">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
    <div class="field span-2">
      <label class="form-label">Marque *</label>
      <input pInputText formControlName="marque" placeholder="Apple, Samsung, Xiaomi..." />
      <small class="text-danger" *ngIf="form.get('marque')?.touched && form.get('marque')?.invalid">
        La marque est obligatoire.
      </small>
    </div>

    <div class="field span-2">
      <label class="form-label">Modèle *</label>
      <input pInputText formControlName="modele" placeholder="iPhone 15, Galaxy S24..." />
      <small class="text-danger" *ngIf="form.get('modele')?.touched && form.get('modele')?.invalid">
        Le modèle est obligatoire.
      </small>
    </div>

    <div class="field">
      <label class="form-label">Prix (€) *</label>
      <p-inputNumber formControlName="prix" mode="decimal" [minFractionDigits]="2" [maxFractionDigits]="2" placeholder="0.00"></p-inputNumber>
      <small class="text-danger" *ngIf="form.get('prix')?.touched && form.get('prix')?.invalid">
        Le prix doit être supérieur à 0.
      </small>
    </div>

    <div class="field">
      <label class="form-label">Stock *</label>
      <p-inputNumber formControlName="stock" placeholder="0"></p-inputNumber>
      <small class="text-danger" *ngIf="form.get('stock')?.touched && form.get('stock')?.invalid">
        Le stock ne peut pas être négatif.
      </small>
    </div>

    <div class="field span-2">
      <label class="form-label">Description</label>
      <textarea pInputTextarea formControlName="description" rows="4" placeholder="Caractéristiques, état, particularités..."></textarea>
    </div>

    <div class="field span-2 actions">
      <button pButton type="submit" label="Enregistrer" icon="pi pi-check" [disabled]="submitting"></button>
      <button pButton type="button" label="Annuler" class="p-button-secondary" (click)="onCancel()"></button>
    </div>
  </form>
</div>
